<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0" />
    <title>DuckDuckGo</title>
    <link rel="canonical" href="https://duckduckgo.com/" />
  </head>
  <body>
    <a name="top"></a>
    <center id="lite_wrapper">
      <a class="header-url" href="/html/"><span class="header">DuckDuckGo</span></a>
      <iframe name="ifr" width="0" height="0" border="0" class="hidden"></iframe>
      <form id="challenge-form" action="//duckduckgo.com/anomaly.js" method="POST">
        <div class="anomaly-modal__mask">
          <div class="anomaly-modal__modal is-ie" data-testid="anomaly-modal">
            <div class="anomaly-modal__title">
              Unfortunately, bots use DuckDuckGo too.
            </div>
            <div class="anomaly-modal__description">
              Please complete the following challenge to confirm this search was made by a human.
            </div>
            <div class="anomaly-modal__instructions">Select all squares containing a duck:</div>
            <div class="anomaly-modal__puzzle-margins">
              <div class="anomaly-modal__puzzle">
                <div class="anomaly-modal__box" data-index="0">
                  <label class="anomaly-modal__label" for="image-check-0">
                    <input
                      type="checkbox"
                      class="anomaly-modal__check"
                      name="image-check-0"
                      id="image-check-0"
                    />
                  </label>
                </div>
                <div class="anomaly-modal__box" data-index="1">
                  <label class="anomaly-modal__label" for="image-check-1">
                    <input
                      type="checkbox"
                      class="anomaly-modal__check"
                      name="image-check-1"
                      id="image-check-1"
                    />
                  </label>
                </div>
              </div>
            </div>
            <div class="anomaly-modal__controls">
              <button type="submit" class="btn btn--primary anomaly-modal__submit">
                Continue
              </button>
            </div>
          </div>
        </div>
      </form>
    </center>
  </body>
</html>
