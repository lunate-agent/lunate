name: CI capacity retry

# A leg GitHub never gave a runner is retried, not reported (#923). The push run 43904858046 on `main`
# went red with `verify (macos-latest, 1/2)` and `perf (macos-latest)` cancelled before a single step
# started -- their check runs carry GitHub's own "The job was not acquired by Runner of type hosted even
# after multiple attempts" -- while every job that did get a runner was green. "If it is a runner flake,
# rerun the run" is what the red-main card asks a session to do by hand; this does it by itself, once.
#
# This cannot be a job in `ci.yml`: GitHub accepts a rerun only for a completed run, and every job of
# `ci.yml` runs inside the run it would have to rerun. `workflow_run: completed` is the trigger that
# fires after that, which is why the retry lives in this file instead of in the matrix.
#
# The retry covers what failed and nothing else (`rerun-failed-jobs`), so the green Ubuntu and Windows
# work is not paid for twice. That is also why `red-main-issue` fails on the deferral path: a job that
# succeeded is not rerun, so the reporter has to be one of the failures to see attempt two and say that the
# retry is spent and a rerun is the remedy. No card is filed for such a leg in either attempt (#922). The
# decision is `scripts/ci-issue-triage --capacity-json`, the same pure decision the reporter uses, so the
# two cannot disagree about what a capacity red is.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# One retry per triggering run, never a cancelled one: two runs of this file for the same CI run would
# ask for the same rerun twice.
concurrency:
  group: ci-capacity-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read
  # The one side effect of this workflow: rerunning the triggering run's failed jobs.
  actions: write

jobs:
  retry:
    name: retry
    # The events that run the full matrix and that the reporter reports on, a red run only, and the
    # retry budget: a run at attempt two is not retried again, so a runner shortage costs one extra
    # attempt and never a loop.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 2 &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule') &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the triggering run's jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            >"${RUNNER_TEMP}/jobs.json"

      - name: Decide whether this red is a runner-capacity red
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          capacity=""
          if [ "$(python3 scripts/ci-issue-triage --capacity-json "${RUNNER_TEMP}/jobs.json")" = "capacity" ]; then
            capacity=true
            echo "the run's red jobs never acquired a runner: retrying its failed jobs"
          else
            echo "the run failed with a job that ran: nothing to retry, the reporter files the card"
          fi
          echo "capacity=${capacity}" >>"${GITHUB_OUTPUT}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              printf '### Runner capacity retry\n\n'
              printf 'Run: %s\n\n' "${{ github.event.workflow_run.html_url }}"
              if [ -n "${capacity}" ]; then
                printf 'The run'"'"'s red jobs never acquired a hosted runner, so its failed jobs are retried once.\n'
              else
                printf 'The run failed in a job that ran, so it is reported rather than retried.\n'
              fi
            } >>"${GITHUB_STEP_SUMMARY}"
          fi

      - name: Retry the run's failed jobs
        if: steps.decide.outputs.capacity == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"
