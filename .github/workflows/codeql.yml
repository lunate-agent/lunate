name: CodeQL

on:
  # Prose cannot introduce a code-scanning finding, and the analysis builds the whole solution: a
  # docs-only change skipped CodeQL for seven minutes and proved nothing. The ignore list mirrors the
  # docs profile's allow-list in scripts/ci-plan.sh. A pull request does not run CodeQL (#831): the
  # push to main analyzes the merged commit and the weekly schedule keeps main watched, so the
  # analysis is not repeated for every pull request on the same diff.
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'adr/**'
      - 'openspec/**'
  schedule:
    # Weekly, Monday 01:30 UTC.
    - cron: '30 1 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (csharp)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build
        run: |
          set -euo pipefail
          dotnet restore lunate.slnx
          dotnet build lunate.slnx --no-restore -c Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
