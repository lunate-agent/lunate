name: Docs lint

# Docs-only pushes skip the CI matrix (see ci.yml paths-ignore); this workflow
# keeps their Markdown linted and their links/navigation checked so violations
# cannot land unseen.
on:
  push:
    branches: [main]
    paths:
      - '*.md'
      - 'docs/**'
      - 'adr/**'
      - 'openspec/**'

# Supersede only a pull request's own older run. This workflow runs on pushes to main: a newer push
# must not cancel an older run that is still producing the advisory result for its commit (#705).
concurrency:
  group: docs-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check docs links and navigation
        run: python3 scripts/docs-check --check

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.3
