name: Measure verify shards

# Temporary measurement lane for #789: the pull-request CI runs Ubuntu only, so the Windows
# before/after pole has no run of its own. This workflow runs the same four shards on
# windows-latest for pull request #1043 and uploads each shard's timing artifacts. It is removed
# again before the change is archived.

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: read

jobs:
  measure:
    name: measure (windows-latest, ${{ matrix.shard }}/4)
    if: github.event.pull_request.number == 1043
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      RID: win-x64
      VERIFY_SKIP_PLATFORM_CHECKS: "1"
      DOTNET_CLI_UI_LANGUAGE: en
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      - name: Install hyperfine (Windows)
        if: matrix.shard == 1
        shell: pwsh
        run: |
          $version = '1.20.0'
          $asset = "hyperfine-v$version-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri "https://github.com/sharkdp/hyperfine/releases/download/v$version/$asset" -OutFile $zip
          $expected = '2508c549b049b1d4342d08edc1cb42bfac169082b6e3069431b5bab9822dbb32'
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "hyperfine: checksum mismatch for $asset ($actual)" }
          $dir = Join-Path $env:RUNNER_TEMP "hyperfine-$version"
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $binary = Join-Path $dir "hyperfine-v$version-x86_64-pc-windows-msvc/hyperfine.exe"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $binary)
          & $binary --version

      - name: Install jq (Windows)
        if: matrix.shard == 1
        shell: pwsh
        run: |
          if (Get-Command jq -ErrorAction SilentlyContinue) { jq --version; exit 0 }
          $version = '1.7.1'
          $asset = 'jq-windows-amd64.exe'
          $exe = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri "https://github.com/jqlang/jq/releases/download/jq-$version/$asset" -OutFile $exe
          $expected = '7451fbbf37feffb9bf262bd97c54f0da558c63f0748e64152dd87b0a07b6d6ab'
          $actual = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "jq: checksum mismatch for $asset ($actual)" }
          $dir = Join-Path $env:RUNNER_TEMP "jq-$version"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Move-Item -Path $exe -Destination (Join-Path $dir 'jq.exe')
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          & (Join-Path $dir 'jq.exe') --version

      - name: Verify (bash)
        shell: bash
        env:
          BUDGET_MS: 350
        run: bash scripts/verify.sh --shard "${{ matrix.shard }}/4"

      - name: Upload timing
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: measure-timing-win-x64-${{ matrix.shard }}-of-4
          path: artifacts/verify-timing/
          if-no-files-found: warn
          retention-days: 14
