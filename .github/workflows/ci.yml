name: CI

on:
  push:
    branches: [main]
    # A tag is a release candidate or a release: the full gate, including the PowerShell leg, must
    # run on it even when the commit itself was already verified (the tag is what ships).
    tags: ['v*']
    # Docs/spec-only pushes skip CI (they cannot break the build). A push that
    # touches any code or workflow file still runs the full matrix; docs-only
    # pushes are linted by the docs-lint workflow instead. Path filters are not
    # evaluated for tag pushes.
    paths-ignore:
      - 'docs/**'
      - 'adr/**'
      - 'openspec/**'
      - '*.md'
  pull_request:
    # ready_for_review is not in GitHub's default set: without it, a draft that
    # is marked ready would keep the statuses of the run it had as a draft.
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue runs the required check on the combined head of a batch. Without this trigger
  # `ci-ok` never reports for a merge group and the queue stalls.
  merge_group:
  # The nightly run keeps the path-filtered PowerShell leg honest: a Windows-only regression that
  # arrives through a path the filter does not name still lands within a day, not at the next tag.
  # A red nightly files its own issue (kind/bug, 0.3) so it cannot sit unnoticed.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      verify_shard_count:
        description: "Verify shards per OS (1 for the baseline, 2 for the sharded run)."
        required: true
        type: choice
        options: ["1", "2"]
        default: "2"

# Supersede in-flight runs only for the same obligation: a pull-request push makes the pull
# request's previous run obsolete, while a push to main, a tag and a merge-group gate each need
# their own completed verdict. The nightly runs on the same branch as a push, so it gets its own
# group and cancels nothing (#705).
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which gate this change needs. Prose (docs, ADRs, OpenSpec proposals/specs, root Markdown) cannot
  # break the build, so it gets the three-minute docs profile; anything else -- including any change
  # to this workflow -- gets the full matrix. The rule lives in scripts/ci-plan.sh, deny-by-default,
  # and its self-test runs here so a broken plan cannot silently downgrade a code pull request.
  plan:
    name: plan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.decide.outputs.profile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The decision diffs the pull request against its base, so the history has to be there.
          fetch-depth: 0

      - name: Tooling self-tests
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci-plan.sh --self-test
          bash scripts/ci-ok.sh --self-test
          bash scripts/ci-powershell-paths.sh --self-test
          python3 scripts/docs-sync --self-test
          bash scripts/no-docs-references.sh --self-test
          bash scripts/no-wip-commits.sh --self-test

      # A wip commit is the queue driver's safety net for a stalled session: it preserves work that
      # would otherwise be lost, and it belongs in a draft. This job only runs for a pull request
      # that is ready for review, so reaching it with a wip subject means the draft flag came off
      # before the commit was rewritten -- the one thing the safety net must never allow.
      - name: No wip commits in a ready pull request
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/no-wip-commits.sh

      - name: Decide the profile
        id: decide
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            # The batch is judged by what it changes against the branch it will land on, exactly as
            # a pull request is: a batch of prose-only pull requests gets the docs profile.
            git diff --name-status -M "${BASE_SHA}...HEAD" >changed.txt
            echo "changed paths (merge group):"
            cat changed.txt
            bash scripts/ci-plan.sh --paths-file changed.txt >>"${GITHUB_OUTPUT}"
            cat "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            # A push to main already filters prose-only changes (paths-ignore above), so whatever
            # arrives here gets the whole gate.
            echo "not a pull request: the full gate runs"
            echo "profile=full" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          git diff --name-status -M "origin/${BASE_REF}...HEAD" >changed.txt
          echo "changed paths:"
          cat changed.txt
          bash scripts/ci-plan.sh --paths-file changed.txt >>"${GITHUB_OUTPUT}"
          cat "${GITHUB_OUTPUT}"

  # Which legs the changed paths actually touch. Today that is one question -- does the Windows
  # PowerShell leg have to run? -- but it lives in a job of its own so ci-ok can tell a legitimate
  # skip (the paths did not match) from a missing one (they did). The decision itself is in
  # scripts/ci-powershell-paths.sh: deny-by-default, with the Windows-specific source list derived
  # from the code's own markers rather than a hand-kept list of files.
  changes:
    name: changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      powershell: ${{ steps.powershell.outputs.powershell }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The decision diffs the pull request against its base, so the history has to be there.
          fetch-depth: 0

      - name: Does the PowerShell leg need to run?
        id: powershell
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request | merge_group) ;;
            *)
              # A push, a tag, a manual dispatch or the nightly run always exercises the Windows gate.
              echo "not a pull request: the PowerShell leg runs"
              echo "powershell=true" >>"${GITHUB_OUTPUT}"
              exit 0
              ;;
          esac
          if [ "${EVENT_NAME}" = "merge_group" ]; then
            git diff --name-status -M "${BASE_SHA}...HEAD" >changed.txt
          else
            git diff --name-status -M "origin/${BASE_REF}...HEAD" >changed.txt
          fi
          cat changed.txt
          bash scripts/ci-powershell-paths.sh --paths-file changed.txt >>"${GITHUB_OUTPUT}"
          cat "${GITHUB_OUTPUT}"

  # The platform-independent half of the gate: formatting, the generated docs regions, markdownlint,
  # the public API, the OpenSpec tree and the two agent-hygiene checks. Running it once on Linux is
  # the point -- a Windows runner formatting the same source as a macOS runner was cost, not depth.
  # The OS legs skip these steps (VERIFY_SKIP_PLATFORM_CHECKS=1) and keep build, test, publish and
  # the artifact proofs, which genuinely differ per OS.
  platform:
    name: platform
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The public-API step diffs PublicAPI.Shipped.txt against the merge base with origin/main.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      # `dotnet format --no-restore` needs the assets files; a restore is enough, no build.
      - name: Restore
        shell: bash
        run: dotnet restore lunate.slnx --nologo

      # The gate pins the CLI version it was checked against; the flake that ships with a runner is
      # not that version.
      - name: Install openspec
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --prefix "${RUNNER_TEMP}/openspec" @fission-ai/openspec@1.14.0
          echo "${RUNNER_TEMP}/openspec/bin" >>"${GITHUB_PATH}"

      - name: Platform checks
        shell: bash
        run: bash scripts/verify.sh --profile platform

  verify:
    name: verify (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shard_count }})
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The test phase sharded across two jobs per OS (#390): verify.sh's
        # --shard i/n partitions the solution's test projects by position, and
        # each shard runs its slice of both culture passes. Shard 1 also owns
        # every non-test step (publish, budgets, roundtrips, format, docs
        # checks, public API); a shard > 1 runs only the build it needs plus
        # its test slice. The ruleset requires ci-ok, and ci-ok requires the
        # verify job, which fails on any failed shard.
        # Manual dispatch can compare --shard 1/1 with the normal two-shard run
        # on the same commit. Pull requests always use the fixed [1, 2] matrix.
        shard: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_shard_count == '1' && fromJSON('[1]') || fromJSON('[1, 2]') }}
        include:
          # budget_ms: calibrated in spike S-3 (docs/spikes/S-3/report.md, ADR 0005
          # accepted 2026-10-04) — runner startup median + ~50% headroom, rounded up to 50 ms.
          # Re-calibrate when a runner image or baseline shifts. The local default
          # in scripts/perf.sh stays 150 ms.
          # memory_gate_mb: idle peak-RSS gate (MB) per OS (ADR 0009); provisional
          # 150 until the T-18 TUI subject exists (report-only until then).
          - os: ubuntu-latest
            rid: linux-x64
            budget_ms: 250
            memory_gate_mb: 150
            shard_count: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_shard_count || 2 }}
          - os: macos-latest
            rid: osx-arm64
            budget_ms: 300
            # The shared macOS runner's floor is bimodal (~80-240 ms quiet, ~310-330 ms loaded), so a
            # breach here is measured and printed, not fatal; `perf (macos-latest)` enforces the budget
            # on a leg that runs nothing else.
            budget_enforce: 0
            memory_gate_mb: 150
            shard_count: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_shard_count || 2 }}
          - os: windows-latest
            rid: win-x64
            budget_ms: 350
            memory_gate_mb: 150
            shard_count: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_shard_count || 2 }}
    env:
      RID: ${{ matrix.rid }}
      # The platform-independent checks (format, docs, public API, Openspec) run once in the
      # `platform` job; this leg does build, test, publish and the artifact proofs.
      VERIFY_SKIP_PLATFORM_CHECKS: "1"
      # English-first CI logs: pin the dotnet CLI / test-runner UI text. The
      # de-AT culture pass still sets the test culture via LANG; only UI
      # strings are pinned (defense in depth over scripts/verify.*).
      DOTNET_CLI_UI_LANGUAGE: en
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The public-API step diffs PublicAPI.Shipped.txt against the merge
          # base with origin/main; PR checkouts are shallow and lack origin/main,
          # so fetch full history.
          fetch-depth: 0
        # Force LF checkout on windows: the public-API step diffs tracked
        # *PublicAPI.Shipped.txt files, so autocrlf rewrites would show as noise.
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      # The de-AT culture pass runs under LC_ALL=de_AT.UTF-8. The ubuntu runner
      # image does not ship that locale, so bash children warn to stderr
      # ("setlocale: LC_ALL: cannot change locale"), which tests that capture a
      # child's stderr exactly would see. Generate it so the pass is faithful.
      - name: Generate de_AT locale (Linux)
        if: runner.os == 'Linux'
        run: sudo locale-gen de_AT.UTF-8

      # The bash guard's platform matrix: the Linux leg runs the bubblewrap refusal (or, when the
      # runtime refuses user namespaces — Ubuntu AppArmor — the detection notice) for real.
      # ADR 0024.
      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bubblewrap
          bwrap --version

      - name: Install hyperfine (Linux)
        if: runner.os == 'Linux' && matrix.shard == 1
        run: |
          set -euo pipefail
          version=1.20.0
          asset="hyperfine-v${version}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${asset}" \
            "https://github.com/sharkdp/hyperfine/releases/download/v${version}/${asset}"
          printf '%s  %s\n' \
            3285ec7959285288137043dd81dce0dde056227018a8277532d9a364b4f03c2b \
            "${RUNNER_TEMP}/${asset}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}"
          install "${RUNNER_TEMP}/hyperfine-v${version}-x86_64-unknown-linux-musl/hyperfine" \
            /usr/local/bin/hyperfine
          hyperfine --version

      - name: Install hyperfine (macOS)
        if: runner.os == 'macOS' && matrix.shard == 1
        run: |
          set -euo pipefail
          brew install hyperfine
          hyperfine --version

      - name: Install hyperfine (Windows)
        if: runner.os == 'Windows' && matrix.shard == 1
        shell: pwsh
        run: |
          $version = '1.20.0'
          $asset = "hyperfine-v$version-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri "https://github.com/sharkdp/hyperfine/releases/download/v$version/$asset" -OutFile $zip
          $expected = '2508c549b049b1d4342d08edc1cb42bfac169082b6e3069431b5bab9822dbb32'
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "hyperfine: checksum mismatch for $asset ($actual)"
          }
          $dir = Join-Path $env:RUNNER_TEMP "hyperfine-$version"
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $binary = Join-Path $dir "hyperfine-v$version-x86_64-pc-windows-msvc/hyperfine.exe"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $binary)
          & $binary --version

      - name: Install jq (Windows)
        if: runner.os == 'Windows' && matrix.shard == 1
        shell: pwsh
        run: |
          if (Get-Command jq -ErrorAction SilentlyContinue) {
            jq --version
            exit 0
          }
          $version = '1.7.1'
          $asset = 'jq-windows-amd64.exe'
          $exe = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri "https://github.com/jqlang/jq/releases/download/jq-$version/$asset" -OutFile $exe
          $expected = '7451fbbf37feffb9bf262bd97c54f0da558c63f0748e64152dd87b0a07b6d6ab'
          $actual = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "jq: checksum mismatch for $asset ($actual)"
          }
          $dir = Join-Path $env:RUNNER_TEMP "jq-$version"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Move-Item -Path $exe -Destination (Join-Path $dir 'jq.exe')
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          & (Join-Path $dir 'jq.exe') --version

      - name: Verify (bash)
        shell: bash
        env:
          BUDGET_MS: ${{ matrix.budget_ms }}
          STARTUP_BUDGET_ENFORCE: ${{ matrix.budget_enforce }}
        run: bash scripts/verify.sh --shard "${{ matrix.shard }}/${{ matrix.shard_count }}"

      # The one real-container leg: the host path stays the default, and this step is the only
      # place a container engine is required. It runs in the existing shard so ci-ok needs no new
      # job; the E2E class skips itself when the variable is absent, so local verify is unchanged.
      - name: Container E2E (Linux)
        if: runner.os == 'Linux' && matrix.shard == 1
        shell: bash
        env:
          LUNATE_CONTAINER_E2E: docker:alpine:3.20
          MSBUILDDISABLENODEREUSE: "1"
        run: |
          set -euo pipefail
          docker pull alpine:3.20
          dotnet tests/Lunate.Coding.Tests/bin/Release/net10.0/Lunate.Coding.Tests.dll \
            -class "Lunate.Coding.Tests.ContainerEnvironmentE2ETests"

      # The gate's own self-tests need the published binary (perf and the shipped-API
      # fixture), which only shard 1 produces; the test slices of shards > 1 prove the
      # partition, and gate-tests.sh itself runs in full here.
      - name: Gate self-tests
        if: matrix.shard == 1
        shell: bash
        run: bash scripts/gate-tests-retry.sh

      - name: Memory checks (ADR-0009)
        if: matrix.shard == 1
        shell: bash
        env:
          MEMORY_GATE_MB: ${{ matrix.memory_gate_mb }}
        run: bash scripts/memory.sh ci

      - name: Upload verification artifacts
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@v7
        with:
          name: verify-${{ matrix.rid }}
          path: |
            artifacts/
            .artifacts/
          if-no-files-found: warn

  # The prose leg: markdownlint, the generated-region check, the "docs are not build inputs" guard and
  # `openspec validate --all --strict`. No .NET, no build, no tests -- which is the point: a proposal
  # or a page cannot be reddened by an unrelated flake in a suite it never runs.
  verify-docs:
    name: verify-docs
    needs: plan
    if: needs.plan.outputs.profile == 'docs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The docs profile compares changed paths with origin/main; a shallow
          # checkout does not create that remote-tracking ref.
          fetch-depth: 0

      # The gate pins the CLI version it was checked against; the flake that ships with a runner is
      # not that version.
      - name: Install openspec
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --prefix "${RUNNER_TEMP}/openspec" @fission-ai/openspec@1.14.0
          echo "${RUNNER_TEMP}/openspec/bin" >>"${GITHUB_PATH}"

      - name: Verify (docs profile)
        shell: bash
        run: bash scripts/verify.sh --profile docs

  # The Windows PowerShell gate runs as its own job so it proceeds in parallel
  # with the bash matrix. Running it sequentially on the same runner made
  # Windows the ~16m critical path (bash ~9m40s + pwsh ~5m50s); in parallel the
  # pipeline lands around ~10m while both gates still run on every PR.
  verify-powershell:
    name: verify-powershell (windows)
    needs: [plan, changes]
    if: needs.plan.outputs.profile == 'full' && needs.changes.outputs.powershell == 'true'
    runs-on: windows-latest
    # A red nightly files its own issue; a pull request must not.
    permissions:
      contents: read
      issues: write
    env:
      RID: win-x64
      BUDGET_MS: 350
      # Formatting, docs lint and the public-API diff run once in the platform job; this leg
      # skips the second copy (#435). A local Windows verify.ps1 keeps the full gate.
      VERIFY_SKIP_PLATFORM_CHECKS: "1"
      # English-first CI logs (same rationale as the matrix job).
      DOTNET_CLI_UI_LANGUAGE: en
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The public-API step diffs PublicAPI.Shipped.txt against the merge
          # base with origin/main; PR checkouts are shallow and lack origin/main,
          # so fetch full history.
          fetch-depth: 0
        # Force LF checkout: the public-API step diffs tracked
        # *PublicAPI.Shipped.txt files, so autocrlf rewrites would show as noise.
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      - name: PowerShell test-runner self-tests
        shell: pwsh
        run: ./scripts/verify-test-runner.tests.ps1

      - name: Install hyperfine (Windows)
        shell: pwsh
        run: |
          $version = '1.20.0'
          $asset = "hyperfine-v$version-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri "https://github.com/sharkdp/hyperfine/releases/download/v$version/$asset" -OutFile $zip
          $expected = '2508c549b049b1d4342d08edc1cb42bfac169082b6e3069431b5bab9822dbb32'
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "hyperfine: checksum mismatch for $asset ($actual)"
          }
          $dir = Join-Path $env:RUNNER_TEMP "hyperfine-$version"
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $binary = Join-Path $dir "hyperfine-v$version-x86_64-pc-windows-msvc/hyperfine.exe"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $binary)
          & $binary --version

      - name: Verify (PowerShell)
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-win-x64-powershell
          path: |
            artifacts/
            .artifacts/
          if-no-files-found: warn

      # The nightly run is the safety net for the path filter: if it is red, a Windows-only
      # regression exists somewhere the filter did not name. Filed automatically so it cannot sit
      # unnoticed until the next tag, and deduplicated so a week of red nights is one issue.
      - name: File an issue when the nightly gate fails
        if: failure() && github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Nightly PowerShell gate failed on main"
          body="The nightly \`ci.yml\` run failed in the PowerShell leg on \`main\`.

          Run: ${RUN_URL}
          Commit: \`${GITHUB_SHA}\`

          This leg is path-filtered on pull requests, so a red nightly means a Windows-only change
          reached \`main\` through a path the filter did not classify — or the filter itself is wrong.
          Triage the failing step, then either fix the code or widen \`scripts/ci-powershell-paths.sh\`
          (its self-test has a case for it)."
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}" \
              --label kind/bug --milestone 0.3.0
          fi

  # The dedicated cold-startup leg (#240). The floor measured inside verify is still noisy on
  # the shared macOS runner: across 29 successful `main` runs (2026-10-28/29, post-#135,
  # post-ADR-0005 floor gate) the macOS floor read 77-275 ms, p95 256 ms against a 300 ms
  # budget — a bimodal runner, not a binary change — while Ubuntu (26-41 ms) and Windows
  # (60-139 ms) stayed tight. So the measurement gets its own quiet job: restore, build
  # Release, publish, run scripts/perf.sh, nothing else. Budgets are unchanged (ADR-0005);
  # do not raise them here. The verify legs keep measuring startup after their publish —
  # the verify gate's behaviour is intact; this leg adds an independent, quiet measurement
  # on the runner class the evidence named. A quiet Ubuntu or windows measurement is what
  # the same evidence showed, so those legs are not duplicated here; add a matrix entry
  # below only when a runner's numbers ask for it.
  perf:
    name: perf (${{ matrix.os }})
    needs: plan
    # The startup budget is a release verdict and a nightly trend, nothing else. A release tag may
    # fail on it; the nightly reports it and the number is tracked over time. A push to main or a
    # merge queue batch must never go red on it: a shared runner varies by a few percent, and a 4%
    # overrun (311 ms against a 300 ms budget) ejected a whole batch from the merge queue. The
    # per-PR verify shards still enforce the budget through STARTUP_BUDGET_ENFORCE.
    if: needs.plan.outputs.profile == 'full' && (github.event_name == 'schedule' || github.ref_type == 'tag')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            budget_ms: 300
    env:
      RID: ${{ matrix.rid }}
      DOTNET_CLI_UI_LANGUAGE: en
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      - name: Install hyperfine (macOS)
        run: |
          set -euo pipefail
          brew install hyperfine
          hyperfine --version
          jq --version

      # Build and publish what verify.sh's startup step measures — same configuration, same
      # publish flags (ADR-0008 release shape) — on a runner that runs nothing else first.
      - name: Build (Release)
        run: dotnet build lunate.slnx -c Release --nologo

      - name: Publish
        run: |
          dotnet publish src/Lunate.Coding/Lunate.Coding.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishReadyToRun=true \
            -o "artifacts/publish/${{ matrix.rid }}" \
            --nologo

      - name: Startup budget (dedicated measurement)
        env:
          BUDGET_MS: ${{ matrix.budget_ms }}
        run: bash scripts/perf.sh "artifacts/publish/${{ matrix.rid }}/lunate"

  # Single aggregate check for branch protection: the ruleset requires only
  # "ci-ok", so renaming, adding or removing a matrix leg cannot silently drop
  # a required check. always() so a failed leg produces a definitive red
  # instead of a skipped (missing) check; skipped or cancelled legs are not
  # success. No path filters exist on pull_request, so no path filter can
  # leave this check pending on a PR; new top-level verification jobs must be
  # added to "needs" here to stay covered.
  #
  # The plan decides WHICH legs run; this job decides whether the run that
  # actually happened counts as success, and it fails closed on a profile it
  # cannot read. The legs the profile does not select must be skipped, not
  # green: a docs plan that also ran the full matrix means the plan lied.
  #
  # This job must never be skipped on a draft: branch protection reads a
  # skipped required check as satisfied, so a head whose only run was the draft
  # run would show "All checks have passed" with no gate behind it. The draft
  # check is a failing step in scripts/ci-ok.sh instead -- a failure cannot
  # satisfy a required context -- while `plan` keeps its draft gate so a draft
  # push still costs no matrix. scripts/ci-ok.sh --self-test pins both halves.
  ci-ok:
    name: ci-ok
    needs: [plan, changes, verify, verify-powershell, platform, verify-docs, perf]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Every required job succeeded
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PLAN: ${{ needs.plan.result }}
          PROFILE: ${{ needs.plan.outputs.profile }}
          VERIFY: ${{ needs.verify.result }}
          POWERSHELL: ${{ needs.verify-powershell.result }}
          PS_REQUIRED: ${{ needs.changes.outputs.powershell }}
          DOCS: ${{ needs.verify-docs.result }}
          PERF: ${{ needs.perf.result }}
          PLATFORM: ${{ needs.platform.result }}
        run: bash scripts/ci-ok.sh
