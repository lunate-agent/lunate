# markdownlint-cli2 configuration (see docs/README.md).
# Scope: README.md, CONTRIBUTING.md, SECURITY.md, CHANGELOG.md, AGENTS.md,
# docs/**/*.md, adr/**/*.md, extensions/**/*.md (the supported tier's product
# pages). openspec/ is tool-managed and intentionally out of scope. samples/
# stay out: they are the fitness suite, not published prose.
globs:
  - "README.md"
  - "CONTRIBUTING.md"
  - "SECURITY.md"
  - "CHANGELOG.md"
  - "AGENTS.md"
  - "changes/**/*.md"
  - "docs/**/*.md"
  - "adr/**/*.md"
  - "extensions/**/*.md"
config:
  # Long lines are normal in documentation (long links, tables); MD013 off.
  MD013: false
  # The guide and the historical spike reports use bold lead-ins as visual
  # subsection markers; converting them to headings would restructure the
  # maintainer's documents, so MD036 stays off here.
  MD036: false
  # The README's logo is a light/dark <picture> block — the only inline HTML.
  MD033:
    allowed_elements:
      - picture
      - source
      - img
      - details
      - summary
  # Keep-a-Changelog repeats "Added" / "Fixed" under each released version;
  # only true siblings (same text, same parent) are a duplicate heading.
  MD024:
    siblings_only: true
# A fragment deliberately starts at ###: it is one entry destined for a changelog heading, not a page
# with its own title, and the assembler rejects any other first line (scripts/changelog-assemble).
overrides:
  - filter:
      - "changes/**/*.md"
    config:
      MD041: false
    combine: merge
